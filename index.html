<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéAPI - Explorador Pokémon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Explorador de Pokémon</h1>
        
        <!-- Sección de Búsqueda -->
        <div class="search-section">
            <input type="text" id="pokemon-input" placeholder="Nombre o ID del Pokémon (ej. pikachu, 25)">
            <button id="search-btn">Buscar</button>
        </div>

        <!-- Contenedor para la Vista de Detalle -->
        <div id="pokemon-container" class="pokemon-card hidden">
            <!-- La información del Pokémon se inyectará aquí con JavaScript -->
        </div>

        <!-- Mensaje de Error -->
        <div id="error-message" class="error-hidden">
            <p>Lo sentimos, no se ha encontrado el Pokémon o ha ocurrido un error.</p>
        </div>
    </main>

    <!-- Enlazamos nuestro archivo JavaScript -->
    <script src="app.js"></script>
</body>
</html>
