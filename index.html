<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéAPI - Explorador Pokémon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Explorador de Pokémon</h1>
        
        <!-- Sección de Búsqueda -->
        <div class="search-section">
            <input type="text" id="pokemon-input" placeholder="Nombre o ID del Pokémon (ej. pikachu, 25)">
            <button id="search-btn">Buscar</button>
        </div>

        <!-- Contenedor para la Vista de Detalle -->
        <div id="pokemon-container" class="pokemon-card hidden">
        <div class="card-front">
            <header class="card-header">
            <h2 id="pokemon-name"></h2>
            <p id="pokemon-hp" class="card-hp"></p>
            </header>
            <div class="card-art">
            <img id="pokemon-image" alt="">
            </div>
            <div class="card-info">
            <p id="pokemon-id"></p>
            <div id="pokemon-types"></div>
            </div>
            <ul id="pokemon-stats"></ul>
            <footer class="card-footer">
                <span>Datos: PokéAPI</span>
                <span id="pokemon-height"></span>
                <span id="pokemon-weight"></span>
            </footer>
        </div>
        <div class="card-back" aria-hidden="true">
            <span class="card-back-emblem">★</span>
        </div>
        </div>
        
        <!-- Mensaje de Error -->
        <div id="error-message" class="error-message hidden">
            <p>Lo sentimos, no se ha encontrado el Pokémon o ha ocurrido un error.</p>
        </div>
    </main>

    <!-- Capa oscura que aparece al ampliar la carta -->
    <div id="card-overlay" class="overlay hidden"></div>

    <!-- Enlazamos nuestro archivo JavaScript -->
    <script src="app.js"></script>
</body>
</html>
